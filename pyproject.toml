[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "translate-books"
version = "0.1.0"
description = "用本机 Ollama 模型先概括、再翻译 EPUB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "lxml>=5.3,<7"]

[project.scripts]
translate-books = "translate_books.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
